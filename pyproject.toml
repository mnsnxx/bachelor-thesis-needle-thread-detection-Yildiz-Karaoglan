[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assisted-suturing-vision"
version = "0.1.0"
description = "Hardware-independent scene-state contract for assisted suturing research"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
